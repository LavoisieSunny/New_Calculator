services:
  app:
    build: .
    container_name: compensation-calc-app
    ports:
      - "3111:3109"
    environment:
      - COMP_CALC_PORT=3109
      - COMP_CALC_HOST=0.0.0.0
      - COMP_CALC_DEBUG=True
      - QDRANT_URL=http://qdrant:3108
      - LLM_API_ENDPOINT=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
    volumes:
      - ./paddle_models/paddlex:/root/.paddlex
      - ./paddle_models/paddleocr:/root/.paddleocr
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: compensation-calc-qdrant
    ports:
      - "3108:3108"
    environment:
      - QDRANT__SERVICE__HTTP_PORT=3108
    volumes:
      - ./qdrant_db:/qdrant/storage
    restart: unless-stopped
