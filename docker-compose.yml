services:
  app:
    build: .
    container_name: compensation-calc-app
    ports:
      - "7202:7203"
    environment:
      - COMP_CALC_PORT=7203
      - COMP_CALC_HOST=0.0.0.0
      - COMP_CALC_DEBUG=True
      - QDRANT_URL=http://qdrant:7204
      - LLM_API_ENDPOINT=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
    volumes:
      - ./paddle_models/paddlex:/root/.paddlex
      - ./paddle_models/paddleocr:/root/.paddleocr
    restart: unless-stopped
    # Expose the host's NVIDIA GPU to the container using NVIDIA Container Toolkit.
    # Note: This requires the NVIDIA Container Toolkit installed on the host machine.
    # The container uses the host's GPU driver directly; an in-container CUDA toolkit is not required
    # as the paddlepaddle-gpu pip wheel bundles its own CUDA/cuDNN runtime.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]


  qdrant:
    image: qdrant/qdrant:latest
    container_name: compensation-calc-qdrant
    ports:
      - "7204:7204"
    environment:
      - QDRANT__SERVICE__HTTP_PORT=7204
    volumes:
      - ./qdrant_db:/qdrant/storage
    restart: unless-stopped
